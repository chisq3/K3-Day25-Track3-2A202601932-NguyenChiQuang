providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
  shared_state_backend: redis
  redis_url: "redis://localhost:6379/0"
  redis_prefix: "rl:lab25:cb:"
  state_ttl_seconds: 300
  graceful_degradation: true
cache:
  enabled: true
  backend: redis
  ttl_seconds: 300
  similarity_threshold: 0.90
  redis_url: "redis://localhost:6379/0"
  redis_prefix: "rl:lab25:"
  graceful_degradation: true
  redis_retry_interval_seconds: 0.25
load_test:
  requests: 100
  concurrency: 8
  random_seed: 202601932
budget:
  enabled: true
  max_cost: 0.05
  warning_ratio: 0.80
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
      backup: 0.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
      backup: 0.0
  - name: all_healthy
    description: "Baseline — both providers healthy"
    provider_overrides:
      primary: 0.0
      backup: 0.0
  - name: all_providers_down
    description: "Both providers fail 100% — static fallback should contain the blast radius"
    provider_overrides:
      primary: 1.0
      backup: 1.0
    cache_enabled: false
  - name: primary_recovers
    description: "Primary starts down, then recovers after its circuit reset timeout"
    provider_overrides:
      primary: 1.0
      backup: 0.0
    cache_enabled: false
    recovery_provider: primary
    recovery_after_requests: 12
    recovery_fail_rate: 0.0
